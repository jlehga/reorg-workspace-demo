# Exported for Streamlit Community Cloud / Render Blueprint deploy.
# Free demo: no paid addons required.
services:
  - type: web
    name: reorg-workspace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
